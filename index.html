<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water - End the Global Water Crisis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section with Logo -->
    <header class="header">
        <div class="header-content">
            <!-- Logo - You can replace this with an actual image -->
            <img src="img/charitywater_logo_horizontal_BlackText.png" alt="Charity Water Logo" class="logo">
        </div>
    </header>

    <!-- Main Content Section with Two Columns -->
    <main class="main-content">
        <!-- Left Column: Text and Donation Options -->
        <div class="left-column">
            <!-- Main Headline -->
            <h1 class="main-headline">Join us to end the global water crisis</h1>
            
            <!-- Subheadline -->
            <p class="subheadline">We bring clean and safe drinking water to communities all around the world and every dollar makes an impact</p>
            
            <!-- Main Donate Button -->
            <a href="https://www.charitywater.org/" class="donate-btn">Donate</a>
            
            <!-- Quick Amount Buttons Container -->
            <div class="quick-amounts">
                <a href="https://www.charitywater.org/" class="amount-btn">$5</a>
                <a href="https://www.charitywater.org/" class="amount-btn">$10</a>
                <a href="https://www.charitywater.org/" class="amount-btn">$20</a>
                <a href="https://www.charitywater.org/" class="amount-btn">$30</a>
            </div>
            
            <!-- Custom Amount Input -->
            <div class="custom-amount-container">
                <label for="custom-amount" class="custom-label">Other amount:</label>
                <div class="custom-input-wrapper">
                    <input type="number" id="custom-amount" class="custom-input" placeholder="Enter amount" min="1">
                    <a href="https://www.charitywater.org/" class="custom-donate-btn">Donate Custom</a>
                </div>
            </div>
        </div>

        <!-- Right Column: Image -->
        <div class="right-column">
            <!-- Girl with Water Image -->
            <img src="https://images.unsplash.com/photo-1559821481-18c80dd6f75f?auto=format&fit=crop&w=600&q=80" alt="Girl running water from a spigot" class="hero-image">
        </div>
    </main>
</body>
</html>
